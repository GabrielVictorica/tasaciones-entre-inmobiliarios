<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070706">
<!-- Todo se pide desde la raíz, para que /<código> encuentre los datos y los videos (en GitHub Pages esta misma página se sirve como 404.html) -->
<base href="/">
<title>Tasación · Gabriel Victorica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* Cada informe es un archivo de datos (datos/<código>.json) hecho de bloques. Esta página los dibuja:
   la cantidad de comparables, de puntos o de etapas puede cambiar y cada bloque se acomoda solo.
   Estilo: fondo casi negro, letra de palo seco grande, con una cursiva con serifa para la palabra que importa
   (en los textos, lo que va entre *asteriscos*).
   Navegación (pedido de Gabriel, 10/11/2026): se baja y listo. Ninguna sección se queda fija ni pide bajar de más;
   arriba siempre dice en qué parte se está y hay un índice para saltar. Los comparables van en una sola tabla. */
:root{
  --fondo:#070706; --tinta:#f0eee4; --suave:#aeaca2; --tenue:#4b4a45; --linea:rgba(240,238,228,.16); --acento:#d9df9c; --rojo:#9d1f1f;
  --sans:"Inter Tight",system-ui,sans-serif; --ital:"Instrument Serif",Georgia,serif; --barra:46px;
}
*{box-sizing:border-box;margin:0}
html{background:var(--fondo);scroll-padding-top:calc(var(--barra) + 10px)}
body{background:var(--fondo);color:var(--tinta);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:56px;overflow-x:clip}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(46vmax 34vmax at 88% 30%,rgba(150,84,22,.18),transparent 68%),
  radial-gradient(40vmax 30vmax at 6% 68%,rgba(74,88,46,.18),transparent 70%)}
main{position:relative;z-index:1}
h1,h2,h3{font-family:var(--sans);font-weight:500;letter-spacing:-.04em;line-height:1;text-wrap:balance}
em{font-family:var(--ital);font-style:italic;font-weight:400;letter-spacing:-.015em;font-size:1.07em}
p{text-wrap:pretty}
a{color:inherit}
button{font:inherit;color:inherit}
.ancho{width:min(1120px,100% - 40px);margin-inline:auto}
section{padding:clamp(64px,10vh,120px) 0;position:relative}
.rotulo{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.rotulo::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--acento)}
.titulo{font-size:clamp(36px,5.6vw,76px);max-width:16ch}
.texto{color:var(--suave);max-width:54ch;font-size:17.5px;margin-top:20px}
.al-centro{text-align:center}.al-centro .rotulo{justify-content:center}.al-centro .titulo,.al-centro .texto{margin-inline:auto}
.llamada{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;padding-bottom:6px;border-bottom:1px solid var(--tinta);transition:gap .3s,color .3s,border-color .3s}
.llamada::after{content:"→";font-weight:400}
.llamada:hover{gap:16px;color:var(--acento);border-color:var(--acento)}

/* BARRA DE ARRIBA: en qué parte del informe se está, y el índice */
#barra{position:fixed;inset:0 0 auto 0;height:var(--barra);z-index:40;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 16px;
  background:rgba(7,7,6,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);font-size:13px}
#barra .donde{display:flex;align-items:baseline;gap:10px;min-width:0}
#barra .paso{color:var(--acento);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
#barra .nombre{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barra button{background:none;border:1px solid var(--linea);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
#avance{position:fixed;left:0;top:calc(var(--barra) - 2px);height:2px;width:100%;background:var(--acento);transform-origin:0 50%;transform:scaleX(0);z-index:41}
#indice{position:fixed;inset:0;z-index:50;background:rgba(7,7,6,.97);display:none;overflow:auto;padding:70px 22px 90px}
#indice.abierto{display:block}
#indice h2{font-size:34px;margin-bottom:22px}
#indice ol{list-style:none;padding:0;max-width:640px}
#indice a{display:flex;gap:18px;align-items:baseline;padding:16px 0;border-top:1px solid var(--linea);text-decoration:none;font-size:20px;letter-spacing:-.02em}
#indice a span{color:var(--acento);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
#indice .cerrar{position:fixed;right:16px;top:8px;background:none;border:1px solid var(--linea);border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
#pie{position:fixed;inset:auto 0 0 0;z-index:35;background:rgba(7,7,6,.86);backdrop-filter:blur(10px);border-top:1px solid var(--linea);
  font-size:10.5px;line-height:1.4;letter-spacing:.02em;color:var(--suave);padding:8px 16px;text-align:center}

.entra{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*90ms)}
.entra.visto{opacity:1;transform:none}

/* PORTADA */
.portada{padding:var(--barra) 0 0;min-height:100svh;display:grid;grid-template-rows:minmax(0,1fr) auto}
.portada .media{position:relative;min-height:38svh;overflow:hidden}
.portada .media img,.portada .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.portada .media.plano img{object-fit:contain;background:#0d0d0b}
.portada .media::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--fondo) 0%,rgba(7,7,6,0) 34%)}
.portada .base{padding:26px 20px 84px}
.portada h1{font-size:clamp(44px,10vw,140px);line-height:.94}
.portada .tira{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 20px;margin-top:20px;padding-top:16px;border-top:1px solid var(--linea);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.portada .sigue{display:inline-flex;align-items:center;gap:10px;margin-top:26px;font-size:13px;color:var(--suave)}
.portada .sigue::before{content:"↓";color:var(--acento);animation:baja 1.8s ease-in-out infinite}
@keyframes baja{50%{transform:translateY(5px)}}

/* TEXTO DESTACADO (presentación, frase central) */
.escribe .grande{font-weight:500;font-size:clamp(42px,8vw,118px);line-height:.96;letter-spacing:-.05em;max-width:13ch;text-wrap:balance}
.escribe .grande em{color:var(--acento)}
.escribe .medio{font-weight:500;font-size:clamp(27px,4.2vw,56px);line-height:1.06;letter-spacing:-.04em;max-width:23ch;text-wrap:balance}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:28px 40px;border-top:1px solid var(--linea);padding-top:30px;margin-top:48px}
.cifra b{display:block;font-weight:500;font-size:clamp(54px,7.6vw,104px);line-height:.9;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.cifra span{display:block;margin-top:12px;font-size:14px;color:var(--suave);max-width:22ch}
.desarrollo{display:grid;gap:24px;margin-top:44px}
.desarrollo p{font-size:clamp(20px,2.3vw,28px);line-height:1.22;letter-spacing:-.02em;max-width:30ch}
.desarrollo .caso{font-size:16px;line-height:1.55;letter-spacing:0;color:var(--suave);border-left:1px solid var(--acento);padding-left:20px;max-width:48ch}

/* DESTACADO, PILARES, LISTAS */
.destacado .caja{display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:end;border-block:1px solid var(--linea);padding:clamp(36px,6vw,80px) 0}
.destacado .cita{font-size:clamp(32px,4.8vw,62px)}
.destacado .numero{font-weight:500;font-size:clamp(100px,18vw,240px);line-height:.8;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.destacado .pie{font-size:14px;color:var(--suave);margin-top:18px}
.grilla-auto{display:grid;gap:1px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));margin-top:44px;padding:1px}
.tarjeta{box-shadow:0 0 0 1px var(--linea);padding:clamp(24px,3.2vw,40px)}
.tarjeta .n{font-family:var(--ital);font-style:italic;font-size:60px;line-height:.9;color:var(--acento)}
.tarjeta h3{font-size:clamp(24px,2.7vw,33px);margin:20px 0 10px}
.tarjeta p,.tarjeta li{color:var(--suave);font-size:16px}
.tarjeta ul{list-style:none;padding:0;display:grid;gap:9px}
.tarjeta li{padding-left:16px;position:relative}
.tarjeta li::before{content:"";position:absolute;left:0;top:.66em;width:6px;height:1px;background:var(--acento)}
.tarjeta img{width:100%;aspect-ratio:4/3;object-fit:cover;margin-bottom:20px;display:block}
.remate{margin-top:38px;font-size:clamp(23px,3vw,38px);letter-spacing:-.035em;line-height:1.08}
.filas{list-style:none;padding:0;margin-top:44px}
.filas li{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.15fr);gap:8px 26px;padding:24px 0;border-top:1px solid var(--linea);align-items:baseline}
.filas li:last-child{border-bottom:1px solid var(--linea)}
.filas b{font-family:var(--ital);font-style:italic;font-weight:400;color:var(--acento);font-size:24px}
.filas h3{font-size:clamp(22px,2.5vw,31px);line-height:1.04}
.filas p{color:var(--suave);font-size:16px}
.filas.simple li{grid-template-columns:56px 1fr;font-size:clamp(18.5px,2.1vw,24px);letter-spacing:-.02em;line-height:1.24}

/* FICHA DE LA PROPIEDAD */
.ficha .dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,5vw,64px);align-items:start;margin-top:44px}
.ficha img{width:100%;display:block;border:1px solid var(--linea);background:#0d0d0b}
.ficha dl{display:grid;grid-template-columns:1fr}
.ficha dl div{display:grid;grid-template-columns:minmax(110px,.8fr) 1.6fr;gap:16px;padding:16px 0;border-top:1px solid var(--linea);align-items:baseline}
.ficha dl div:last-child{border-bottom:1px solid var(--linea)}
.ficha dt{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.ficha dd{margin:0;font-size:clamp(19px,2.1vw,24px);letter-spacing:-.02em;line-height:1.2}
.ficha .descripcion{margin-top:30px;display:grid;gap:14px}
.ficha .descripcion p{color:var(--suave);font-size:17px;max-width:60ch}

/* COMPARABLES: una sola tabla. Cada renglón es una propiedad; "Ver el aviso" abre la publicación */
.comparables .ayuda{margin-top:28px;border:1px solid var(--linea);padding:20px 22px;max-width:760px}
.comparables .ayuda b{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acento);margin-bottom:8px}
.comparables .ayuda p{font-size:17px;line-height:1.45}
.comparables .grupo{margin-top:52px}
.comparables .grupo-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 24px;padding-bottom:14px;border-bottom:1px solid var(--tinta)}
.comparables .grupo-cab h3{font-size:clamp(26px,3.2vw,40px)}
.comparables .grupo-cab span{font-size:15px;color:var(--suave)}
.comparables .grupo-cab span b{color:var(--tinta);font-weight:600}
.comparables .grupo > p{color:var(--suave);font-size:16px;margin-top:12px;max-width:64ch}
.comp-cab,.comp{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,1.15fr) minmax(0,.95fr) auto;gap:18px;align-items:center}
.comp-cab{padding:14px 0 10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.comp{padding:20px 0;border-top:1px solid var(--linea)}
.comp .que b{display:block;font-weight:500;font-size:19px;letter-spacing:-.02em;line-height:1.15}
.comp .que small{display:block;font-size:13.5px;color:var(--suave);margin-top:5px;line-height:1.35}
.comp .dato{font-size:17px;font-variant-numeric:tabular-nums}
.comp .dato .et{display:none;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);margin-bottom:3px}
.comp .dato.clave{font-weight:600;font-size:19px}
.comp .dato .tira{display:block;height:3px;background:var(--tenue);margin-top:8px;position:relative}
.comp .dato .tira i{position:absolute;inset:0 auto 0 0;width:var(--w,0%);background:var(--suave)}
.comp .ver{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;border:1px solid var(--linea);border-radius:999px;padding:9px 14px;white-space:nowrap;transition:background .3s,color .3s,border-color .3s}
.comp .ver:hover{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.comp .ver.sin{visibility:hidden}
.comp.propia{margin-top:52px;border:1px solid var(--acento);padding:24px 22px;background:rgba(217,223,156,.06)}
.comp.propia .que b{font-size:24px}
.comp.propia .que small{color:var(--acento);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px;margin:0 0 8px}
.comp.propia .dato .tira i{background:var(--acento)}
.comp .ajustes{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:-4px}
.comp .ajuste{font-size:13px;border:1px solid var(--linea);border-radius:999px;padding:5px 12px;color:var(--suave)}
.comp .ajuste b{font-weight:600;color:var(--tinta);margin-right:6px}
.comparables .conclusion{margin-top:44px;font-size:clamp(23px,3vw,38px);letter-spacing:-.035em;line-height:1.1;max-width:26ch}
.comparables .nota{font-size:14px;color:var(--suave);margin-top:22px;max-width:70ch}

/* LÍNEA DE TIEMPO */
.tiempo .via{position:relative;margin-top:56px}
.tiempo .via::before,.tiempo .trazo{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:var(--linea)}
.tiempo .trazo{background:var(--acento);transform-origin:50% 0;transform:scaleY(var(--p,0))}
.hito{position:relative;width:50%;padding:0 52px clamp(36px,6vh,64px) 0;text-align:right}
.hito:nth-of-type(even){margin-left:50%;padding:0 0 clamp(36px,6vh,64px) 52px;text-align:left}
.hito:last-of-type{padding-bottom:0}
.hito::before{content:"";position:absolute;right:-6px;top:10px;width:11px;height:11px;border-radius:50%;background:var(--fondo);border:1px solid var(--tenue);transition:background .4s,border-color .4s;z-index:1}
.hito:nth-of-type(even)::before{right:auto;left:-5px}
.hito.on::before{background:var(--tinta);border-color:var(--tinta)}
.hito .cuadro{opacity:.35;transition:opacity .6s}
.hito.on .cuadro{opacity:1}
.hito .cuando{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acento)}
.hito h3{font-size:clamp(26px,3.3vw,44px);margin:10px 0 12px}
.hito p{color:var(--suave);font-size:16px;max-width:38ch;display:inline-block}

/* FODA */
.foda .tres{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,270px) minmax(0,1fr);gap:clamp(24px,4.2vw,60px);align-items:center;margin-top:52px}
.foda .lado{display:grid;gap:46px}
.foda .lado.izq{text-align:right}
.foda .sello{font-family:var(--ital);font-style:italic;font-size:52px;line-height:.8;color:var(--acento)}
.foda .item h3{font-size:clamp(25px,2.9vw,36px);margin:10px 0 6px}
.foda .item small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.foda .item ul{list-style:none;padding:0;margin-top:14px;color:var(--suave);font-size:16px;display:grid;gap:9px}
.foda .medio{aspect-ratio:3/4.6;border-radius:999px 999px 0 0;overflow:hidden;border:1px solid var(--linea);display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(120% 70% at 50% 100%,rgba(150,84,22,.34),transparent 70%),#0d0d0b}
.foda .medio img{width:calc(100% + 48px);height:calc(100% + 48px);margin:-24px;object-fit:cover}
.foda .medio b{font-weight:500;font-size:clamp(21px,2.3vw,28px);line-height:1.02;letter-spacing:-.04em;display:block}
.foda .medio span{display:block;margin-top:14px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--suave)}

/* VENDIDAS: carrusel sin fin. Se mueve al bajar la página; se puede arrastrar, deslizar con el dedo o mover con las flechas */
.carrusel{overflow:hidden}
.carrusel .cabeza{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px 40px}
.carrusel .flechas{display:flex;gap:10px}
.carrusel .flechas button{width:52px;height:52px;border-radius:50%;border:1px solid var(--linea);background:none;font-size:19px;cursor:pointer;transition:border-color .3s,background .3s,color .3s}
.carrusel .flechas button:hover{border-color:var(--tinta);background:var(--tinta);color:var(--fondo)}
.cinta{display:flex;gap:16px;margin-top:44px;padding:0 max(20px,calc((100vw - 1120px)/2));overflow-x:auto;scrollbar-width:none;cursor:grab;user-select:none;-webkit-user-select:none}
.cinta::-webkit-scrollbar{display:none}
.cinta.arrastra{cursor:grabbing}
.pieza{flex:none;width:clamp(210px,24vw,290px)}
.pieza .marco{position:relative;overflow:hidden;background:#12110f}
.pieza video{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;pointer-events:none}
.cartel{position:absolute;left:-14%;right:-14%;top:50%;transform:translateY(-50%) rotate(-10deg);background:var(--rojo);color:#f6f2ea;font-weight:600;font-size:clamp(13px,1.3vw,17px);letter-spacing:.34em;text-indent:.34em;
  text-align:center;padding:10px 0;border-block:1px solid rgba(246,242,234,.4);box-shadow:0 12px 30px -10px rgba(0,0,0,.7)}
.pieza b{display:block;font-weight:500;font-size:19px;letter-spacing:-.03em;line-height:1.1;margin-top:14px}
.pieza span.dato{display:block;font-size:14px;color:var(--suave);margin-top:4px}

/* PRECIOS */
.precios .tarjeta h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--suave);line-height:1.3}
.precios .tarjeta .precio{font-weight:500;font-size:clamp(48px,6.2vw,90px);line-height:.9;letter-spacing:-.055em;margin:24px 0 16px;font-variant-numeric:tabular-nums}
.precios .tarjeta .precio small{font-size:.3em;letter-spacing:0;color:var(--suave);margin-right:8px;font-weight:500}
.precios .tarjeta.medio{background:rgba(217,223,156,.06);box-shadow:0 0 0 1px var(--acento)}
.precios .tarjeta.medio h3{color:var(--acento)}
.precios .tarjeta p{font-size:16px}
.nota{font-size:14px;color:var(--suave);margin-top:26px;max-width:72ch}

.tapado{text-align:center}.tapado .titulo{margin-inline:auto}.tapado .texto{margin-inline:auto}.tapado .rotulo{justify-content:center}
.pasos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1px;margin:48px 0 0;padding:1px;text-align:left}
.pasos div{box-shadow:0 0 0 1px var(--linea);padding:22px}
.pasos small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acento)}
.pasos b{display:block;font-weight:500;font-size:20px;letter-spacing:-.03em;line-height:1.12;margin-top:10px}
.cierre{text-align:center;padding-bottom:clamp(100px,16vh,180px)}
.cierre .titulo{max-width:15ch;margin-inline:auto;font-size:clamp(42px,7.6vw,110px)}
.cierre .texto{margin-inline:auto}
.botones{display:flex;flex-wrap:wrap;gap:22px 38px;justify-content:center;margin-top:44px}
.aviso{min-height:100svh;display:grid;place-items:center;text-align:center;padding:40px;color:var(--suave)}

@media (max-width:860px){
  body{font-size:17px}
  .filas li{grid-template-columns:40px 1fr}.filas li p{grid-column:2}
  .tiempo .via::before,.tiempo .trazo{left:5px}

function animar() {
  const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches, $$ = (s) => [...document.querySelectorAll(s)];
  const ver = new IntersectionObserver((xs) => xs.forEach((x) => {
    if (!x.isIntersecting) return;
    const el = x.target; ver.unobserve(el);
    if (el.classList.contains("entra")) el.classList.add("visto");
    if (el.dataset.cuenta && !quieto) contar(el);
  }), { threshold: 0.1 });
  $$(".entra,[data-cuenta]").forEach((el) => ver.observe(el));
  // por si el navegador no avisa (pestaña en segundo plano), nada queda invisible
  setTimeout(() => $$(".portada .entra").forEach((el) => el.classList.add("visto")), 80);

  // barra de arriba: en qué parte se está; índice para saltar
  const secciones = $$("main > section"), paso = document.getElementById("paso"), nombre = document.getElementById("nombre"), indice = document.getElementById("indice");
  const marcar = (s) => { paso.textContent = `${dos(+s.dataset.n)} / ${dos(secciones.length)}`; nombre.textContent = s.dataset.nombre; };
  const donde = new IntersectionObserver((xs) => xs.forEach((x) => x.isIntersecting && marcar(x.target)), { rootMargin: "-45% 0px -50% 0px" });
  secciones.forEach((s) => donde.observe(s)); if (secciones[0]) marcar(secciones[0]);
  document.getElementById("lista-indice").innerHTML = secciones.map((s) => `<li><a href="#${s.id}"><span>${dos(+s.dataset.n)}</span>${e(s.dataset.nombre)}</a></li>`).join("");
  document.getElementById("abrir").onclick = () => indice.classList.add("abierto");
  document.getElementById("cerrar").onclick = () => indice.classList.remove("abierto");
  indice.addEventListener("click", (ev) => { if (ev.target.closest("a")) indice.classList.remove("abierto"); });

  const verVideo = new IntersectionObserver((xs) => xs.forEach((x) => (x.isIntersecting ? x.target.play().catch(() => {}) : x.target.pause())), { threshold: 0.25 });
  $$("[data-video]").forEach((v) => verVideo.observe(v));

  // carrusel de vendidas: se mueve mientras se baja la página; además se puede arrastrar, deslizar con el dedo o mover con las flechas
  const carruseles = $$("[data-carrusel]").map((sec) => { const cinta = sec.querySelector("[data-cinta]"), piezas = cinta.children, n = piezas.length / 2, c = { extra: 0, ultimo: 0 };
    const vuelta = () => piezas[n].offsetLeft - piezas[0].offsetLeft;
    c.poner = () => { const v = vuelta(), r = sec.getBoundingClientRect(), p = (innerHeight - r.top) / (innerHeight + r.height); let x = (c.extra + p * v * 0.55) % v; if (x < 0) x += v; cinta.scrollLeft = x; c.ultimo = cinta.scrollLeft; };
    let arrastre = null;
    cinta.addEventListener("pointerdown", (ev) => { if (ev.pointerType !== "mouse") return; arrastre = ev.clientX; cinta.classList.add("arrastra"); cinta.setPointerCapture(ev.pointerId); });
    cinta.addEventListener("pointermove", (ev) => { if (arrastre == null) return; c.extra -= ev.clientX - arrastre; arrastre = ev.clientX; c.poner(); });
    const soltar = () => { arrastre = null; cinta.classList.remove("arrastra"); };
    cinta.addEventListener("pointerup", soltar); cinta.addEventListener("pointercancel", soltar);
    cinta.addEventListener("scroll", () => { const d = cinta.scrollLeft - c.ultimo; if (Math.abs(d) > 1 && Math.abs(d) < vuelta() / 2) c.extra += d; c.ultimo = cinta.scrollLeft; }, { passive: true });
    sec.querySelectorAll("[data-mover]").forEach((b) => b.addEventListener("click", () => { const de = c.extra, a = de + +b.dataset.mover * (piezas[1].offsetLeft - piezas[0].offsetLeft), t0 = performance.now();
      const ir = (t) => { const k = Math.min(1, (t - t0) / 450); c.extra = de + (a - de) * (1 - Math.pow(1 - k, 3)); c.poner(); if (k < 1) requestAnimationFrame(ir); }; requestAnimationFrame(ir); }));
    return c; });

  const avance = document.getElementById("avance"), vias = $$("[data-via]");
  let pedido = false;
  const alScroll = () => { pedido = false;
    const alto = document.documentElement.scrollHeight - innerHeight;
    avance.style.transform = `scaleX(${alto > 0 ? scrollY / alto : 0})`;
    if (quieto) return;
    for (const c of carruseles) c.poner();
    for (const v of vias) { const r = v.getBoundingClientRect(), corte = innerHeight * 0.66;
      v.style.setProperty("--p", Math.min(1, Math.max(0, (corte - r.top) / r.height))); v.querySelectorAll(".hito").forEach((h) => h.classList.toggle("on", h.getBoundingClientRect().top + 14 < corte)); }
  };
  addEventListener("scroll", () => { if (!pedido) { pedido = true; requestAnimationFrame(alScroll); } }, { passive: true });
  addEventListener("resize", alScroll);
  alScroll();
}

function contar(el) {
  const crudo = el.dataset.cuenta, n = parseFloat(String(crudo).replace(/[^\d.]/g, "")), signo = /^\+/.test(crudo) ? "+" : "";
  if (!isFinite(n)) return;
  const t0 = performance.now(), dura = 1100, fin = signo + plata(n);
  const paso = (t) => { const k = Math.min(1, (t - t0) / dura), s = 1 - Math.pow(1 - k, 3);
    el.textContent = k < 1 ? signo + plata(Math.round(n * s)) : fin; if (k < 1) requestAnimationFrame(paso); };
  requestAnimationFrame(paso); setTimeout(() => { el.textContent = fin; }, dura + 400); // el número final queda aunque la animación no corra
}

async function iniciar() {
  const caja = document.getElementById("informe"), q = new URLSearchParams(location.search);
  // El código del informe sale de la dirección: tasacion.entreinmobiliarios.com/<código>  (o ?i=<código> al probar en la compu)
  const codigo = (q.get("i") || location.pathname.split("/").filter(Boolean).pop() || "").replace(/[^a-z0-9-]/gi, "");
  try {
    if (!codigo || codigo === "index.html") throw new Error("sin código");
    const r = await fetch(`datos/${codigo}.json`, { cache: "no-store" });
    if (!r.ok) throw new Error("no está");
    const d = await r.json();
    document.title = `${d.tipo} · ${liso(d.titulo)}`;
    // Valor tapado: si los datos traen "clave", los precios se ven solo abriendo la dirección con ?ver=<clave>
    const tapado = d.clave && q.get("ver") !== String(d.clave);
    const bloques = d.bloques.filter((b) => BLOQUES[b.tipo]).map((b) => (tapado && b.tipo === "precios" ? { tipo: "texto", nombre: "El valor", rotulo: "El valor", titulo: "El valor te lo presento *en persona*", parrafos: ["Lo vemos juntos en la reunión, con la cuenta completa."] } : b));
    caja.innerHTML = bloques.map((b) => BLOQUES[b.tipo](b, d)).join("");
    [...caja.children].forEach((s, i) => { const b = bloques[i]; s.id = `p${i + 1}`; s.dataset.n = i + 1; s.dataset.nombre = b.nombre || (b.tipo === "escribe" ? b.rotulo || liso(b.texto).replace(/\.$/, "") : NOMBRES[b.tipo]) || liso(b.titulo) || b.rotulo || `Parte ${i + 1}`; });
    animar();
  } catch {
    document.getElementById("barra").style.display = "none";
    caja.innerHTML = `<div class="aviso"><div><h2 class="titulo" style="margin:0 auto 18px">Este informe no está <em>disponible</em></h2><p>Revisá la dirección que te pasó Gabriel.</p></div></div>`;
  }
}
iniciar();
</script>
